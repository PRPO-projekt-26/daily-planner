openapi: "3.0.3"
info:
  title: "Daily Planner REST API"
  description: "API for managing daily tasks and planning."
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"

tags:
  - name: "Planner"
    description: "Daily overview and calendar operations"
  - name: "Reminders"
    description: "Reminder management"

paths:

  

  /planner/daily:
    # DAILY OVERVIEW
    # is called every time that the user opens the app 
    get:
      tags:
        - "Planner"
      summary: "Get daily overview"
      description: "Returns the person's daily schedule and calendar, top 3 reminder and weather forecast."
      operationId: "getDailyOverview"

      # Have decided not to add the parametrers for the filering and sorting as it will happen in 
      # backend with a query. The only order we want is ascending and only the events which endTime is biger than current time.
      parameters:
      - name: "date"
        in: "query"
        required: false
        description: "The date for which events should be retrieved. Defaults to today."
        schema:
          type: "string"
          format: "date"
          example: "2026-05-21"

      responses:
        '200':
          description: "Daily overview retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyOverview'

        '404':
          description: "User not found"

  

  /planner/calendars/{year}/{month}:
    # MONTHLY CALENDAR
    #i  s called by the user when they want to acces the whole calendar
    get:
      tags:
        - "Planner"
      summary: "Get monthly calendar"
      description: "Returns the user's calendar for a specified month."
      operationId: "getMonthlyCalendar"
      parameters:
        - name: "month"
          in: path
          required: true
          description: "Month to retrieve in MM format"
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 11

        - name: "year"
          in: path
          required: true
          description: "Year to retrieve in YYYY format"
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
            example: 2026


      responses:
        '200':
          description: "Monthly calendar retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyCalendar'

        '404':
          description: "User not found"


  /planner/reminders/user:
    # CREATE REMINDER
    # is called by the user when they want to create a new reminder
    post:
      tags:
        - "Reminders"
      summary: "Create a reminder"
      description: "Creates a reminder belonging to the user."
      operationId: "createReminder"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderRequest'

      responses:
        '201':
          description: "Reminder created successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'

        '400':
          description: "Invalid reminder data"

        '404':
          description: "User not found"

    # GET REMINDERS FOR USER
    # is called by the user when they want to see all of their reminders
    get:
      tags:
        - "Reminders"
      summary: "Get reminders of a user"
      description: "Returns all reminders belonging to the user."
      operationId: "getPersonReminders"

      responses:
        '200':
          description: "Person's reminders retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderList'

        '404':
          description: "User not found"

  /planner/reminders/user/{reminderId}:
    # DELETE REMINDER
    # is called by the user when they want to delete a reminder
    delete:
      tags:
        - "Reminders"
      summary: "Delete a reminder"
      description: "Deletes a reminder using its unique id"
      operationId: "deleteReminder"
      parameters:
        - name: "reminderId"
          in: "path"
          required: true
          description: "Unique ID of the reminder"
          schema:
            type: "string"

      responses:
        '204':
          description: "Reminder deleted successfully"

        '404':
          description: "Reminder not found"

    # PATCH REMINDER
    # is called by user when they want to update the reminder
    patch:
      tags:
        - "Reminders"
      summary: "Update a reminder"
      description: "Updates the reminder using its unique id. Only the content and dueAt parameters can be updated."
      operationId: "patchRemindersUser"
      parameters:
        - name: "reminderId"
          in: "path"
          required: true
          description: "Unique ID of the reminder"
          schema:
            type: "string"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderPatchRequest'
      responses:
        '200':
          description: "Reminder updated successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'

        '400':
          description: "Invalid reminder data"
        
        '404':
          description: "Reminder not found"


  

  /planner/reminders:

  # GET ALL REMINDERS
  # is call by the system(app) for sending notifications to users
    get:
      tags:
        - "Reminders"
      summary: "Get all the reminders"
      description: "Retrieves a list of all the existing reminders that have to be sent out as push notifications"
      operationId: "getAllReminders"

      parameters:
        - name: "dueBefore"
          in: "query"
          required: false 
          description: "Retrieves only the reminders that are due before the specified date and time"
          schema: 
            type: "string"
            format: "date-time"
            example: "2026-05-12T16:30:00+01:00"

      responses:
        '200':
          description: "Reminders retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderList'

  
  /planner/reminders/{reminderId}:
    # PATCH REMINDER
    # is called by the app after sending the push notification for the reminder with reminderId
    patch:
      tags:
        - "Reminders"
      summary: "Update the sentAt parameter"
      description: "Updates the sentAt paramater in reminders. Is called after the push notification of the reminder with the reminderId has been sent"
      operationId: "patchReminders"
      parameters:
        - name: "reminderId"
          in: "path"
          required: true
          description: "Unique ID of the reminder"
          schema:
            type: "string"
      responses:
        '204':
          description: "Reminder updated successfully"
        
        '404':
          description: "Reminder not found"

  /weather:
    get:
      tags:
        - "Weather"
      summary: "Get current weather information"
      description: "Retrieve the current weather information for a specified location."
      operationId: "getCurrentWeather"
      
      # specified parameters exist only in this operation, so they are defined here!
      parameters: 
        - name: "city"
          in: "query"
          required: true
          description: "Name of the city to retrieve weather information for."
          schema:
            type: "string"
      responses:
        '200':
          description: "Successful retrieval of weather information."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
        '400':
          description: "Bad request. The city parameter is missing or invalid."
        '404':
          description: "City not found"


components:

  schemas:

    # REMINDERS
    # this is the body of the request when the user is creating an new one
    ReminderRequest:
      type: "object"
      required:
        - "content"
        - "dueAt"
      properties:
        content:
          type: "string"
          description: "Content of the reminder"
          example: "Class scheduled"

        dueAt:
          type: "string"
          format: "date-time" 
          description: "Date and time of the task in the content"
          example: "2026-05-12T16:30:00+01:00" # YYYY-MM-DDTHH:MM:SS+zamik(HH:MM)

    # this is how the whole request looks like
    Reminder:
      type: "object"
      required:
        - "id"
        - "content"
        - "dueAt"
        - "sentAt"
      properties:
        id:
          type: "string"
          description: "Unique reminder ID"
          example: "rem123"

        content:
          type: "string"
          example: "Class scheduled"

        dueAt:
          type: "string"
          format: "date-time"
          example: "2026-11-12T16:30:00+01:00" # YYYY-MM-DDTHH:MM:SS+(HH:MM)

        sentAt:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Indicates when the push notification has been sent. If the parameter is empty it indicates that the notification has yet to be sent."
          default: null
          example: "2026-05-12T16:30:00+01:00"

    # this is returned when app/user request all the requests/ all of users requests
    ReminderList:
      type: "object"
      properties:
        reminders:
          type: "array"
          items:
            $ref: '#/components/schemas/Reminder'

    ReminderPatchRequest:
      type: "object"
      properties:
        content:
          type: "string"
          example: "do homework due to tomorrow instead of Sunday!"
        dueAt:
          type: "string"
          format: "date-time"
          example: "2026-11-12T16:30:00+01:00"


    # DAILY OVERVIEW 
    # is returned when the user opens the app
    DailyOverview:
      type: "object"
      properties:
        date:
          type: "string"
          format: "date"
          example: "2026-05-12"

        schedule:
          type: "array"
          description: "All scheduled events for that day"
          items:
            $ref: '#/components/schemas/ScheduleEvent'

        topReminders:
          type: "array"
          description: "The person's top three most recent reminders"
          maxItems: 3
          items:
            $ref: '#/components/schemas/Reminder'

        weather:
          $ref: '#/components/schemas/WeatherResponse'


    # SCHEDULE EVENT
    # this is how an event on the calendar is structured
    ScheduleEvent:
      type: "object"
      properties:
        id:
          type: "string"
          example: "event123"

        title:
          type: "string"
          example: "Lecture"

        description:
          type: "string"
          example: "PRPO"

        startTime:
          type: "string"
          format: "date-time"
          example: "2026-11-12T09:00:00+01:00"

        endTime:
          type: "string"
          format: "date-time"
          example: "2026-11-12T11:00:00+01:00"

        source:
          type: "string"
          description: "Origin of the event"
          enum:
            - "GOOGLE_CALENDAR"
            - "IMPORTED_SCHEDULE"
          example: "GOOGLE_CALENDAR"

    # MONTHLY CALENDAR
    # is returned when the user requests to see the specified month and year
    MonthlyCalendar:
      type: "object"
      properties:
        year:
          type: "integer"
          description: "The requested year"
          example: "2026"

        month:
          type: "integer"
          description: "The requested month"
          example: "05"

        days:
          type: "array"
          description: "All days and their scheduled events in the requested month"
          items:
            $ref: '#/components/schemas/CalendarDay'

    # how one day in the calendar looks
    CalendarDay:
      type: "object"
      properties:
        date:
          type: "string"
          format: "date"
          example: "2026-11-12"

        events:
          type: "array"
          items:
            $ref: '#/components/schemas/ScheduleEvent'

    # WEATHER
    WeatherResponse:
      type: "object"
      required:
        - "city"
        - "currentTemperature"
        - "maximumTemperature"
        - "minimumTemperature"
        - "precipitation"
        - "cloudCover"
      properties:
        city:
          type: "string"
          example: "Radovljica"
          description: "Name of the city for which the weather information is provided."
        currentTemperature:
          type: "number"
          format: "double"
          example: 20.5
          description: "Current temperature in Celsius."
        maximumTemperature:
          type: "number"
          format: "double"
          example: 26.8
          description: "Maximum temperature tor that day in Celsius."
        minimumTemperature:
          type: "number"
          format: "double"
          example: 12.2
          description: "Minimum temperature for that day in Celsius."
        precipitation:
          type: "string"
          example: "There will be rain in the afternoon"
          description: "The rain forecast"
        cloudCover:
          type: "string"
          example: "Clear sky"
          description: "The cloud cover for that day"
        description:
          type: "string"
          example: "Sunny day"
          description: "Description of the current weather conditions."
